<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Site Acessível - Lupa</title>
  <link rel="stylesheet" href="style.css">
  <script src ="script.js">
</head>

<body>

  <div class="acessibilidade">
    <strong>Recursos de acessibilidade</strong>

    <button id="botaoLupa">
      Ativar lupa
    </button>
  </div>

  <header>
    <h1>Amostra projeto dos IFAs</h1>

    <p>
Página criada para compartilhar informações sobre acessibilidade, desenvolvida no âmbito do Itinerário Formativo e relacionada aos conteúdos do segundo trimestre das disciplinas de Física e Tecnociência, Programação e Robótica.

    </p>
  </header>

  <main id="conteudo">

    <section>
      <h2>O que é IFA</h2>

      <p>
Itinerário formativo é uma parte do Ensino Médio que permite ao aluno aprofundar seus conhecimentos em uma área de interesse, como Ciências da Natureza, Matemática, Humanas, Linguagens ou formação técnica.

      </p>

      <p>
      <h3>Robótica
</h3>
        <p>Robótica é uma matéria que ensina a criar, montar e programar robôs, utilizando conhecimentos de programação, eletrônica e tecnologia para desenvolver soluções e projetos.</p>
      
        <h3>Programação</h3>
          
          <p>Programação é uma matéria que ensina a criar códigos e sistemas para computadores e outros dispositivos, desenvolvendo o raciocínio lógico e a capacidade de resolver problemas por meio da tecnologia.
</p>
          
        <h3> Física e tecnociência
</h3>
          <p>Física e Tecnociência é uma matéria que estuda os fenômenos da natureza e sua relação com a tecnologia, mostrando como os conhecimentos científicos são usados para criar soluções e entender o mundo ao nosso redor.</p>
      </p>
    </section>

    <section>
      <h2>Esse projeto tem como objetivo criar um site que seja acessível para pessoas com a visão baixa. </h2>

      <div class="card">
        <h3>Ampliação</h3>
        <p>
          A lupa permite aumentar visualmente uma determinada região
          da página enquanto o usuário movimenta o cursor.
        </p>
      </div>

      <div class="card">
        <h3>Contraste</h3>
        <p>
          Cores com contraste adequado ajudam pessoas com baixa visão
          a identificar textos e elementos da interface.
        </p>
      </div>

      <div class="card">
        <h3>Navegação pelo teclado</h3>
        <p>
          Todos os elementos interativos devem poder ser acessados
          utilizando apenas o teclado.
        </p>
      </div>
    </section>

    <section>
      <h2>Exemplo de conteúdo</h2>

      <p>
        Este texto serve para demonstrar o funcionamento da lupa.
        Movimente o cursor sobre a página depois de ativar o recurso
        para visualizar uma região ampliada.
      </p>

      <ul>
        <li>Texto ampliado</li>
        <li>Elementos visuais ampliados</li>
        <li>Maior facilidade de leitura</li>
        <li>Recurso opcional de acessibilidade</li>
      </ul>
    </section>

  </main>

  <div id="lupa" aria-hidden="true">
    <div id="lupa-conteudo"></div>
  </div>

</body>
</html>
